# TLS test broker. The certificates come from scripts/gen-certs.sh. With the
# default per_listener_settings false, allow_anonymous applies to both
# listeners.
allow_anonymous true

# Server TLS: clients verify the broker against ca.crt.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Mutual TLS: the broker also requires a client certificate signed by ca.crt.
listener 8884
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
