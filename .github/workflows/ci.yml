name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Other events get a
# group per commit, so no run on master is ever cancelled or skipped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check package contents and metadata
        run: python .github/check_dist.py dist

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/pip check
          cd /tmp
          /tmp/wheel-env/bin/python -c "import MQTTLibrary; print(MQTTLibrary.__version__, MQTTLibrary.__file__)"
          /tmp/wheel-env/bin/python -m robot.libdoc MQTTLibrary list

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Tests run against the wheel the build job checked, the same file a release
  # would publish.
  test:
    name: test (baseline)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Created first so the broker logs and versions can be saved even when
      # an early step fails.
      - name: Create results directory
        run: mkdir -p results

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # paho-mqtt comes from the wheel's declared range. Robot Framework is
      # pinned to 7.x so a new major release cannot turn the baseline red.
      - name: Install the wheel
        run: |
          python -m pip install dist/*.whl "robotframework~=7.0"
          python -m pip check
          python -m pip freeze > results/pip-freeze.txt
          python -c "import MQTTLibrary; assert 'site-packages' in MQTTLibrary.__file__, MQTTLibrary.__file__"

      - name: Start test brokers
        run: docker compose up --wait --wait-timeout 60

      - name: Run acceptance tests
        run: robot --outputdir results tests

      - name: Save broker logs
        if: always()
        run: docker compose logs --no-color > results/brokers.log 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results
          path: results/
          if-no-files-found: error

      - name: Stop test brokers
        if: always()
        run: docker compose down
