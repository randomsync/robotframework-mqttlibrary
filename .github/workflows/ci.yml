name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Other events get a
# group per commit, so no run on master is ever cancelled or skipped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Created first so the broker logs and versions can be saved even when
      # an early step fails.
      - name: Create results directory
        run: mkdir -p results

      # Baseline for the unmodified library, which needs paho-mqtt 1.x.
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze > results/pip-freeze.txt

      - name: Start test brokers
        run: docker compose up --wait --wait-timeout 60

      - name: Run acceptance tests
        run: robot --pythonpath src --outputdir results tests

      - name: Save broker logs
        if: always()
        run: docker compose logs --no-color > results/brokers.log 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results
          path: results/
          if-no-files-found: error

      - name: Stop test brokers
        if: always()
        run: docker compose down
