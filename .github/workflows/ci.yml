name: CI

on:
  push:
    branches: [master, 0.7.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Other events get a
# group per commit, so no run on master is ever cancelled or skipped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (paho-mqtt ${{ matrix.paho }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # "latest" resolves from setup.py. The other leg is its lower bound,
        # so keep it in step with install_requires.
        paho: [latest, "1.3.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Created first so the broker logs and versions can be saved even when
      # an early step fails.
      - name: Create results directory
        run: mkdir -p results

      # Install the package itself, so the published dependency range is what
      # gets tested, not the source tree.
      - name: Install package and test dependencies
        env:
          PAHO: ${{ matrix.paho }}
        run: |
          python -m pip install -r requirements.txt .
          if [ "$PAHO" != latest ]; then python -m pip install "paho-mqtt==$PAHO"; fi
          python -m pip check
          python -m pip freeze > results/pip-freeze.txt
          python -c "import MQTTLibrary; assert 'site-packages' in MQTTLibrary.__file__, MQTTLibrary.__file__; print(MQTTLibrary.__file__)"

      - name: Start test brokers
        run: docker compose up --wait --wait-timeout 60

      - name: Run acceptance tests
        run: robot --outputdir results tests

      - name: Save broker logs
        if: always()
        run: docker compose logs --no-color > results/brokers.log 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-paho-${{ matrix.paho }}
          path: results/
          if-no-files-found: error

      - name: Stop test brokers
        if: always()
        run: docker compose down
