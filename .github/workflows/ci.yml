name: CI

on:
  push:
    branches: [master]
    # Release tags are bare versions, for example 1.0.0rc1 or 1.0.0.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Tags get a group per
# tag, and other events a group per commit, so no run on master and no
# release is ever cancelled or skipped.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.ref_type == 'tag') && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The dev extra pins ruff.
      - name: Install
        run: python -m pip install ".[dev]"

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      # Fails on docstring errors.
      - name: Build the keyword documentation
        run: python -m robot.libdoc MQTTLibrary "$RUNNER_TEMP/MQTTLibrary.html"

      # Syntax errors fail the run; deprecation and other warnings fail the
      # step.
      - name: Dry-run the acceptance suites
        run: |
          set -o pipefail
          python -m robot --dryrun --output NONE --report NONE --log NONE tests/acceptance 2>&1 | tee "$RUNNER_TEMP/dryrun.txt"
          if grep -q '\[ WARN \]' "$RUNNER_TEMP/dryrun.txt"; then
            echo "::error::robot --dryrun printed warnings"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check package contents and metadata
        run: python .github/check_dist.py dist

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/pip check
          cd /tmp
          /tmp/wheel-env/bin/python -c "import MQTTLibrary; print(MQTTLibrary.__version__, MQTTLibrary.__file__)"
          /tmp/wheel-env/bin/python -m robot.libdoc MQTTLibrary list

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Tests run against the wheel the build job checked, the same file a release
  # would publish.
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.versions }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        versions: [latest]
        # The oldest supported versions. Keep them in step with
        # requires-python and the dependency floors in pyproject.toml.
        include:
          - python: "3.9"
            versions: minimum
            robotframework: "4.1.3"
            paho: "2.1.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Created first so the broker logs and versions can be saved even when
      # an early step fails.
      - name: Create results directory
        run: mkdir -p results

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # The latest legs take the newest Robot Framework 7 and the newest
      # paho-mqtt in the wheel's range. Robot Framework stays below 8 so a new
      # major release cannot turn every PR red; supporting it is a deliberate
      # change. The minimum leg pins both in the same install, so they are
      # never upgraded or downgraded afterwards.
      - name: Install the wheel
        env:
          ROBOTFRAMEWORK: ${{ matrix.robotframework }}
          PAHO: ${{ matrix.paho }}
        run: |
          reqs=(dist/*.whl coverage pytest)
          if [ -n "$ROBOTFRAMEWORK" ]; then
            reqs+=("robotframework==$ROBOTFRAMEWORK")
          else
            reqs+=("robotframework<8")
          fi
          if [ -n "$PAHO" ]; then reqs+=("paho-mqtt==$PAHO"); fi
          python -m pip install "${reqs[@]}"
          python -m pip check
          python -m pip freeze > results/pip-freeze.txt
          python -c "import MQTTLibrary; assert 'site-packages' in MQTTLibrary.__file__, MQTTLibrary.__file__"

      # Before the brokers start, which shows the unit tests need none.
      - name: Run unit tests
        run: python -m coverage run -m pytest tests/unit

      - name: Start test brokers
        run: docker compose up --wait --wait-timeout 60

      - name: Run acceptance tests
        run: python -m coverage run -m robot --outputdir results tests/acceptance

      # The floor (fail_under) is set in pyproject.toml.
      - name: Check coverage
        run: |
          set -o pipefail
          python -m coverage combine
          python -m coverage report | tee results/coverage.txt

      - name: Save broker logs
        if: always()
        run: docker compose logs --no-color > results/brokers.log 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-py${{ matrix.python }}-${{ matrix.versions }}
          path: results/
          if-no-files-found: error

      - name: Stop test brokers
        if: always()
        run: docker compose down

  # Release jobs run only when a tag is pushed, not for a manual run on a tag.
  # The checks run next to the tests, so a wrong tag, stale docs or a missing
  # CHANGELOG section fail early and nothing is published.
  release-checks:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install the wheel
        run: python -m pip install dist/*.whl "robotframework<8" packaging

      - name: Check the tag matches version.py
        id: tag
        run: python .github/release.py check "$GITHUB_REF_NAME"

      - name: Check docs/index.html is current
        run: python .github/check_docs.py docs/index.html

      - name: Extract the release notes from CHANGELOG.md
        run: python .github/release.py notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # PyPI trusted publishing: PyPI accepts this workflow file (ci.yml) in the
  # pypi environment, so no API token is stored. Only this job can mint the
  # OIDC token.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [lint, build, test, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/robotframework-mqttlibrary/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [publish, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-checks.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
