name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python 3.11, paho-mqtt 1.6, Robot Framework 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Baseline for the unmodified library, which needs paho-mqtt 1.x.
      - name: Install dependencies
        run: python -m pip install "paho-mqtt~=1.6" "robotframework~=7.0"

      - name: Start test brokers
        run: docker compose up --wait

      - name: Run acceptance tests
        run: robot --pythonpath src --outputdir results tests

      - name: Save broker logs
        if: always()
        run: docker compose logs --no-color > results/brokers.log 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results
          path: results/
          if-no-files-found: error

      - name: Stop test brokers
        if: always()
        run: docker compose down
